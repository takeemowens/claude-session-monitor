<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none';">
  <title>Claude Session Monitor</title>
  <style>
    /* ── Reset ──────────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Kill all focus rings — this is a widget, not a form */
    *:focus, *:focus-visible, *:focus-within { outline: none !important; box-shadow: none !important; }

    html, body {
      width: 460px;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      cursor: default;
      user-select: none;
    }

    /* ── Design tokens — light (default) ────────────────────────────────────── */
    :root {
      --clay:       #D97757;
      --clay-hover: #C4663E;
      --clay-dim:   rgba(217,119,87,0.12);
      --surface:    #FFFFFF;
      --shadow:
        0 2px 16px rgba(0,0,0,0.04),
        0 8px 40px rgba(0,0,0,0.07);
      --t1:         #1C1B19;
      --t2:         #5C5B59;   /* 6.8:1 on white — WCAG AA ✓ */
      --t3:         #767674;   /* 4.6:1 on white — WCAG AA ✓ */
      --track:      rgba(0,0,0,0.07);
      --divider:    rgba(0,0,0,0.06);
      --r:          20px;
      --px:         22px;
      --input-bg:   rgba(0,0,0,0.04);
      --input-border: rgba(0,0,0,0.10);
      --input-focus: rgba(217,119,87,0.45);
      --btn-ghost:  rgba(0,0,0,0.06);
      --btn-ghost-h: rgba(0,0,0,0.10);
      --error:      #B03027;
      --dash-bg:    linear-gradient(180deg, #FFFFFF 0%, #F7F6F5 100%);
    }

    /* ── Dark theme ──────────────────────────────────────────────────────────── */
    .dark {
      --surface:    rgba(22,21,25,0.92);
      --shadow:
        0 2px 16px rgba(0,0,0,0.22),
        0 8px 40px rgba(0,0,0,0.26);
      --clay-hover: #E08060;
      --clay-dim:   rgba(217,119,87,0.18);
      --t1:         rgba(255,255,255,0.92);
      --t2:         rgba(255,255,255,0.72);  /* ~10:1 on dark surface — WCAG AA ✓ */
      --t3:         rgba(255,255,255,0.50);  /* ~6:1 on dark surface  — WCAG AA ✓ */
      --track:      rgba(255,255,255,0.09);
      --divider:    rgba(255,255,255,0.06);
      --input-bg:   rgba(255,255,255,0.07);
      --input-border: rgba(255,255,255,0.12);
      --input-focus: rgba(217,119,87,0.55);
      --btn-ghost:  rgba(255,255,255,0.07);
      --btn-ghost-h: rgba(255,255,255,0.12);
      --error:      #E04A3F;
      --dash-bg:    linear-gradient(180deg, rgba(26,25,30,0.97) 0%, rgba(22,21,26,0.96) 100%);
    }

    /* ── App shell ───────────────────────────────────────────────────────────── */
    #app {
      width: 460px;
      height: 100%;
      background: transparent;
      position: relative;
      border-radius: var(--r);
      overflow: hidden;
    }

    /* ── Motion animations ──────────────────────────────────────────────────── */
    @keyframes widget-in {
      0%   { opacity: 0; transform: translateY(-12px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes widget-out {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-8px) scale(0.98); }
    }

    /* ── View system ─────────────────────────────────────────────────────────── */
    .view {
      position: absolute;
      inset: 0;
      border-radius: var(--r);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.28s ease, background 0.25s ease, box-shadow 0.25s ease;
      pointer-events: none;
    }

    .view.anim-in {
      animation: widget-in 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .view.anim-out {
      animation: widget-out 0.2s cubic-bezier(0.55, 0, 1, 0.45) forwards;
    }
    .view.active {
      opacity: 1;
      pointer-events: all;
    }

    /* ════════════════════════════════════════════════════════════════════════ */
    /*  AUTH VIEW                                                              */
    /* ════════════════════════════════════════════════════════════════════════ */
    /* The front door is always dark, whatever theme the dashboard is in.
       It is a one-time screen, so it gets to be the dramatic moment. */
    #auth-view {
      --aground: #0F1621;
      --atile:   #1B2534;
      --ahair:   #263143;
      --at1:     #EEF2F7;
      --at2:     #8695A8;

      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 34px 34px 26px;
      gap: 0;
      background: var(--aground);
      border-radius: var(--r);
      -webkit-app-region: drag;
    }
    #auth-view button,
    #auth-view a { -webkit-app-region: no-drag; }

    /* Icon tile, lit from behind. This glow is the one flourish on the
       screen; everything else stays flat and quiet. */
    .auth-mark {
      position: relative;
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background: var(--atile);
      border: 1px solid var(--ahair);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }
    .auth-mark::before {
      content: '';
      position: absolute;
      inset: -22px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(217,119,87,0.28) 0%, rgba(217,119,87,0) 68%);
      pointer-events: none;
    }
    .auth-logo { width: 26px; height: 26px; position: relative; }

    .auth-title {
      font-size: 19px;
      font-weight: 600;
      color: var(--at1);
      letter-spacing: -0.4px;
      margin-bottom: 5px;
    }

    .auth-sub {
      font-size: 12.5px;
      color: var(--at2);
      line-height: 1.5;
      max-width: 25ch;
      margin-bottom: 22px;
    }

    .auth-error {
      font-size: 11.5px;
      color: #F08A7A;
      min-height: 0;
      line-height: 1.4;
      margin-bottom: 0;
    }
    .auth-error:not(:empty) { margin-bottom: 12px; }

    .connect-btn {
      width: 100%;
      background: linear-gradient(135deg, #D97757 0%, #E8A44C 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      height: 44px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: filter 0.14s, transform 0.1s, opacity 0.14s;
      margin-bottom: 14px;
      letter-spacing: -0.1px;
    }
    .connect-btn:hover:not(:disabled)  { filter: brightness(1.08); }
    .connect-btn:active:not(:disabled) { transform: scale(0.985); }
    .connect-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    .connect-btn:focus-visible {
      outline: 2px solid #E8A44C;
      outline-offset: 2px;
    }

    /* Full opacity, not a dimmed tint: at 11px this needs to clear 4.5:1
       against the slate ground, and a 0.75 alpha drops it to 3.9:1. */
    .auth-foot {
      font-size: 11px;
      color: var(--at2);
      line-height: 1.5;
      max-width: 30ch;
    }

    /* ════════════════════════════════════════════════════════════════════════ */
    /*  DASHBOARD VIEW                                                         */
    /* ════════════════════════════════════════════════════════════════════════ */
    #dashboard-view {
      background: var(--dash-bg);
      border-radius: var(--r);
      transition: background 0.25s ease;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px var(--px) 14px;
      -webkit-app-region: drag;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-sm { width: 22px; height: 22px; flex-shrink: 0; }

    .header-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--t1);
      letter-spacing: -0.4px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--btn-ghost);
      border-radius: 10px;
      padding: 2px;
      -webkit-app-region: no-drag;
    }

    .ctrl-btn {
      width: 28px;
      height: 26px;
      background: transparent;
      border: none;
      border-radius: 7px;
      color: var(--t3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s, color 0.12s;
    }
    .ctrl-btn:hover { background: var(--btn-ghost-h); color: var(--t2); }
    .ctrl-btn.pinned { color: var(--clay); }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--divider);
      margin: 0 var(--px);
      flex-shrink: 0;
    }

    /* ── Section ─────────────────────────────────────────────────────────── */
    .section {
      padding: 14px var(--px) 10px;
      flex-shrink: 0;
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 9px;
    }

    .section-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--t1);
      letter-spacing: -0.2px;
    }

    .section-meta {
      font-size: 12px;
      color: var(--t2);
      letter-spacing: -0.1px;
      white-space: nowrap;
    }

    /* Bar row: [track flex-1] [%] */
    .bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .prog-track {
      flex: 1;
      height: 10px;
      background: var(--track);
      border-radius: 99px;
      overflow: hidden;
    }

    .prog-bar {
      height: 100%;
      border-radius: 99px;
      background: var(--clay);
      width: 0%;
      transition: width 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .prog-bar.overflow {
      background: linear-gradient(90deg, var(--clay) 0%, #F04020 100%);
      animation: overflow-pulse 2s ease-in-out infinite;
    }

    @keyframes overflow-pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.55; }
    }

    .bar-pct {
      font-size: 13px;
      font-weight: 500;
      color: var(--t2);
      width: 36px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* Extra usage special row */
    .extra-head-right {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .overflow-badge {
      font-size: 10px;
      font-weight: 700;
      color: var(--clay);
      background: var(--clay-dim);
      padding: 2px 7px;
      border-radius: 99px;
      line-height: 1.5;
      display: none;
    }
    .overflow-badge.show { display: inline-flex; }

    /* Footer */
    .footer {
      padding: 10px var(--px) 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-shrink: 0;
    }

    .footer-left { display: flex; flex-direction: column; gap: 4px; }

    .bal-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #3DC96B;
      flex-shrink: 0;
    }

    .f-label   { font-size: 12px; color: var(--t2); }
    .f-val     { color: var(--t1); font-weight: 500; font-variant-numeric: tabular-nums; }
    .f-muted   { font-size: 11px; color: var(--t3); }

    .footer-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .f-ts { font-size: 11px; color: var(--t3); }

    .signout-btn {
      font-size: 11px;
      color: var(--t3);
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      padding: 0;
      transition: color 0.12s;
      -webkit-app-region: no-drag;
    }
    .signout-btn:hover { color: var(--t2); }

    /* ── Collapse / expand ───────────────────────────────────────────────── */
    #details-panel {
      display: none;
    }
    #details-panel.open {
      display: block;
    }

    /* ── Bottom bar ──────────────────────────────────────────────────────── */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px var(--px) 12px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    .expand-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--t3);
      font-family: inherit;
      font-size: 12px;
      letter-spacing: -0.1px;
      padding: 5px 10px;
      border-radius: 8px;
      transition: color 0.12s;
    }
    .expand-btn:hover { color: var(--t2); }
    .expand-btn svg { transition: transform 0.22s ease; }
    .expand-btn.open svg { transform: rotate(180deg); }

    /* ── Animations ─────────────────────────────────────────────────────── */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .spin { animation: spin 0.7s linear infinite; }
  </style>
</head>
<body>
<div id="app">

  <!-- ════════════════════════════════════════════════════════════════════════ -->
  <!--  AUTH VIEW                                                              -->
  <!-- ════════════════════════════════════════════════════════════════════════ -->
  <div class="view" id="auth-view">

    <div class="auth-mark">
      <img class="auth-logo" src="claude-logo.svg" alt="" />
    </div>

    <p class="auth-title">Claude usage</p>
    <p class="auth-sub">Uses the claude.ai session you are already signed in to.</p>

    <div class="auth-error" id="auth-error"></div>

    <button id="connect-btn" class="connect-btn">
      <svg id="connect-spinner" class="spin" style="display:none" width="15" height="15" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" stroke="rgba(255,255,255,0.3)" stroke-width="2.5"/>
        <path d="M12 3a9 9 0 0 1 9 9" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <span id="connect-label">Connect Claude.ai session</span>
      <svg id="connect-arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </button>

    <p class="auth-foot">No API key needed. The only site this reads is claude.ai.</p>

  </div><!-- /auth-view -->


  <!-- ════════════════════════════════════════════════════════════════════════ -->
  <!--  DASHBOARD VIEW                                                         -->
  <!-- ════════════════════════════════════════════════════════════════════════ -->
  <div class="view" id="dashboard-view">

    <!-- Header ─────────────────────────────────────────────────────────────── -->
    <div class="header">
      <div class="header-left">
        <img class="logo-sm" src="claude-logo.svg" alt="Claude" />
        <span class="header-title">Claude Session Monitor</span>
      </div>

      <div class="header-controls">
        <!-- Theme toggle -->
        <button id="btn-theme" class="ctrl-btn" title="Toggle theme">
          <svg id="icon-moon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg id="icon-sun" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
        <!-- Refresh -->
        <button id="btn-refresh" class="ctrl-btn" title="Refresh">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M8 16H3v5"/>
          </svg>
        </button>
        <!-- Close -->
        <button id="btn-close" class="ctrl-btn" title="Close">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div><!-- /header -->

    <div class="divider"></div>

    <!-- Current Session ───────────────────────────────────────────────────── -->
    <div class="section">
      <div class="section-head">
        <span class="section-label">Current session</span>
        <span class="section-meta" id="session-reset">—</span>
      </div>
      <div class="bar-row">
        <div class="prog-track">
          <div class="prog-bar" id="bar-session"></div>
        </div>
        <span class="bar-pct" id="session-pct">—</span>
      </div>
    </div>

    <div id="details-panel">

    <!-- Weekly ────────────────────────────────────────────────────────────── -->
    <div class="section">
      <div class="section-head">
        <span class="section-label">Weekly · All models</span>
        <span class="section-meta" id="weekly-reset">—</span>
      </div>
      <div class="bar-row">
        <div class="prog-track">
          <div class="prog-bar" id="bar-weekly"></div>
        </div>
        <span class="bar-pct" id="weekly-pct">—</span>
      </div>
    </div>

    <!-- Daily Tokens ──────────────────────────────────────────────────────── -->
    <div class="section" id="daily-tokens-section" style="display:none">
      <div class="section-head">
        <span class="section-label">Today's tokens</span>
        <span class="section-meta" id="daily-meta">—</span>
      </div>
      <span class="f-muted" id="daily-snapshots" style="font-size:10px">—</span>
    </div>

    <div class="divider"></div>

    <!-- Extra Usage ───────────────────────────────────────────────────────── -->
    <div class="section">
      <div class="section-head">
        <span class="section-label">Extra usage</span>
        <div class="extra-head-right">
          <span class="overflow-badge" id="overflow-badge"></span>
          <span class="section-meta" id="extra-meta">—</span>
        </div>
      </div>
      <div class="bar-row">
        <div class="prog-track">
          <div class="prog-bar" id="bar-extra"></div>
        </div>
        <span class="bar-pct" id="extra-pct">—</span>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Footer ────────────────────────────────────────────────────────────── -->
    <div class="footer">
      <div class="footer-left">
        <div class="bal-row">
          <span class="status-dot"></span>
          <span class="f-label">Balance <span class="f-val" id="balance">—</span></span>
        </div>
        <span class="f-muted" id="auto-reload-text">—</span>
      </div>
      <div class="footer-right">
        <span class="f-ts" id="app-version" style="opacity:0.4;font-size:10px;"></span>
        <span class="f-ts" id="last-updated">—</span>
        <button id="btn-signout" class="signout-btn">Sign out</button>
      </div>
    </div>

    </div><!-- /details-panel -->

    <!-- Bottom bar ─────────────────────────────────────────────────────────── -->
    <div class="bottom-bar">
      <button id="btn-expand" class="expand-btn">
        <span id="expand-label">Show more</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
    </div>

  </div><!-- /dashboard-view -->

</div><!-- /app -->
<script src="renderer.js"></script>
</body>
</html>
